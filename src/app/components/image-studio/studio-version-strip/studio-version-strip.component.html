<section class="space-y-3">

  <div class="flex items-center justify-between gap-3">
    <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-200">{{ tx('X-16') }}</h3>
    <button
      type="button"
      (click)="downloadAll()"
      [disabled]="items().length === 0 || busy()"
      class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 disabled:opacity-50">
      {{ tx('T-22.downloadAll', { N: items().length }) }}
    </button>
  </div>

  <div class="flex flex-wrap gap-2">
    @for (item of items(); track item.version.number) {
      <button
        type="button"
        (click)="open(item, $event)"
        class="relative w-20 h-20 rounded-lg overflow-hidden border border-slate-300 dark:border-slate-600 hover:ring-2 hover:ring-violet-500 focus:ring-2 focus:ring-violet-500">
        <img [attr.src]="srcOf(item)" [alt]="altOf(item)" class="w-full h-full object-cover" />
        <span class="absolute bottom-0 left-0 px-1.5 bg-slate-900/70 text-white text-[10px] font-semibold rounded-tr-lg">v{{ item.version.number }}</span>
      </button>
    }
  </div>

  @if (messageId(); as id) {
    <div role="alert" class="text-sm text-red-700 dark:text-red-300">{{ tx(id) }}</div>
  }

</section>
