@if (item(); as item) {
  <figure [attr.aria-labelledby]="captionId" class="space-y-2 rounded-xl border border-shell-line bg-shell-rail p-2">
    <img [attr.src]="srcOf(item)" [alt]="altOf(item)" class="w-full rounded-lg object-contain" />
    <figcaption [id]="captionId" class="text-xs font-semibold text-shell-text">{{ label() }}</figcaption>

    @if (editOf(); as source) {
      <span class="inline-block rounded-full border border-shell-line px-2 py-0.5 text-xs text-shell-muted">{{ tx('X-39', { N: source.n }) }}</span>
    }

    <div class="flex flex-wrap items-center gap-2">
      <button
        type="button"
        (click)="download(item)"
        [disabled]="busy()"
        class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-shell-accent hover:opacity-90 disabled:opacity-50 text-white">
        {{ tx('X-8') }}
      </button>
      <button
        type="button"
        (click)="edit(item)"
        [disabled]="generating()"
        class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-shell-line text-shell-text hover:bg-shell-hover disabled:opacity-50">
        {{ tx('T-22.editVersion') }}
      </button>
      @if (editOf(); as source) {
        @if (source.sourceRetained) {
          <button
            type="button"
            (click)="compare(item, source, $event)"
            class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-shell-line text-shell-text hover:bg-shell-hover">
            {{ tx('X-38', { N: source.n }) }}
          </button>
        }
      }
    </div>
  </figure>
}
