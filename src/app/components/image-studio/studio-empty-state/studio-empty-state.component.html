<section class="flex flex-col items-center gap-4 py-8 text-center">
  <div class="space-y-1">
    <h3 class="text-base font-semibold text-shell-text">{{ headline() }}</h3>
    <p class="text-sm text-shell-muted">{{ sentence() }}</p>
  </div>
  <div class="grid w-full grid-cols-1 gap-2 sm:grid-cols-3">
    @for (card of cards(); track card.preset.id) {
      <button
        type="button"
        [attr.aria-label]="card.label"
        (click)="choose(card.preset)"
        class="rounded-lg border border-shell-line px-3 py-3 text-left text-shell-text hover:bg-shell-hover focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-shell-accent transition-colors">
        <span class="block text-xs font-semibold">{{ card.name }}</span>
        @if (card.description) {
          <span class="mt-1 block text-xs text-shell-muted">{{ card.description }}</span>
        }
      </button>
    }
  </div>
</section>
