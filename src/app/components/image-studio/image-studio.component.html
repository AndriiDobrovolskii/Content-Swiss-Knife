<div class="absolute inset-0 flex flex-col lg:flex-row gap-4 p-4 overflow-y-auto overflow-x-hidden">

  <div class="lg:w-64 flex-shrink-0">
    <app-studio-session-list [lang]="lang()" />
  </div>

  <div class="flex-1 min-w-0 space-y-4">

    <app-studio-header [lang]="lang()" />

    <!-- The one generation status region (FR-74, FR-83): the only role="status" element of the studio. -->
    <div role="status" class="sr-only">{{ store.statusMessage() }}</div>

    <!-- The results feed (US-10.5 DD-7): the log, the version strip, the events and Retry, Download all and the SynthID notice. -->
    <app-studio-feed [lang]="lang()" />

    <!-- Errors and notices (FR-83): T-4, T-9, T-14, T-18 and every failure text. -->
    @if (store.message(); as message) {
      <div role="alert" class="text-sm text-red-700 dark:text-red-300">{{ tx(message.textId, message.params) }}</div>
    }

    <!-- The one full-view dialog (FR-10, FR-33): a sibling of the feed's log, never inside it. -->
    <app-studio-full-view [lang]="lang()" />

    <app-studio-composer [lang]="lang()" />

  </div>

</div>
