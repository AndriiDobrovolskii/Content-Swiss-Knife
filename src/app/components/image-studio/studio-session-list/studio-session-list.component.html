<section class="space-y-2">

  <p class="text-xs text-shell-muted">{{ countLine() }}</p>

  <ul [attr.aria-label]="listLabel()" class="space-y-1">
    @for (meta of store.sessions(); track meta.id) {
      <li>
        <button
          type="button"
          (click)="select(meta.id)"
          [attr.aria-current]="meta.id === store.currentSessionId() ? 'true' : null"
          class="w-full text-left px-3 py-2 rounded-lg text-xs border border-shell-line text-shell-text hover:bg-shell-hover focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-shell-accent"
          [class.bg-shell-active]="meta.id === store.currentSessionId()"
          [class.border-shell-accent]="meta.id === store.currentSessionId()">
          @if (nameOf(meta); as name) {
            <span class="block truncate font-semibold">{{ name }}</span>
          }
          <span class="flex items-center justify-between gap-2 text-shell-muted">
            <span>{{ dateOf(meta) }}</span>
            <span>{{ costOf(meta) }}</span>
          </span>
        </button>
      </li>
    }
  </ul>

</section>
