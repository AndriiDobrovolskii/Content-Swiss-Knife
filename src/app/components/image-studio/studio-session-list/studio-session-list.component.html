<section class="space-y-3">

  <div class="flex items-center justify-between gap-3">
    <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-200">{{ tx('X-9') }}</h3>
    <button
      type="button"
      (click)="newSession()"
      class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-violet-600 hover:bg-violet-700 text-white transition-colors">
      {{ tx('T-22.newSession') }}
    </button>
  </div>

  <ul [attr.aria-label]="tx('X-9')" class="space-y-1">
    @for (meta of store.sessions(); track meta.id) {
      <li>
        <button
          type="button"
          (click)="select(meta.id)"
          [attr.aria-current]="meta.id === store.currentSessionId() ? 'true' : null"
          class="w-full text-left px-3 py-2 rounded-lg text-xs border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800"
          [class.border-violet-500]="meta.id === store.currentSessionId()">
          <span class="block font-semibold text-slate-700 dark:text-slate-200">{{ whenOf(meta) }}</span>
          @if (subtitleOf(meta); as subtitle) {
            <span class="block truncate text-slate-500 dark:text-slate-400">{{ subtitle }}</span>
          }
        </button>
      </li>
    }
  </ul>

  <p class="text-xs text-slate-500 dark:text-slate-400">{{ costLine() }}</p>

</section>
