@for (key of keys; track key) {
  <div class="space-y-2">
    <label
      [attr.for]="'operator-note-' + key"
      class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">{{ labels()[key] }}</label>
    <textarea
      [id]="'operator-note-' + key"
      class="w-full p-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg min-h-[80px] focus:ring-2 focus:ring-blue-500 outline-none resize-y text-sm text-slate-800 dark:text-slate-200"
      [value]="values()[key]"
      (input)="onInput(key, $event)"></textarea>
  </div>
}
